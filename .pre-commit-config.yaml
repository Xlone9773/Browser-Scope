repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  # pre-commit manages a Node.js runtime and installs this project's npm package
  # into an isolated hook environment, so no system npx/node_modules are required.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (staged JavaScript/TypeScript)
        entry: oxlint
        language: node
        types: [javascript, jsx, ts, tsx]
        pass_filenames: true

      - id: eslint
        name: ESLint (staged TypeScript)
        entry: eslint --cache --cache-strategy content
        language: node
        files: \\.(ts|tsx)$
        pass_filenames: true
