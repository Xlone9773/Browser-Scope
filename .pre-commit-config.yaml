# pre-commit.ci runs in an isolated environment without the project's Node.js toolchain.
# Skip local Node-based linters there; the repository's CI workflow handles JS/TS linting.
ci:
  skip: [oxlint, eslint]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  # Local developer environment: Node.js and project dependencies must be installed.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (staged JavaScript/TypeScript)
        entry: npx --no-install oxlint
        language: system
        types: [javascript, jsx, ts, tsx]
        pass_filenames: true

      - id: eslint
        name: ESLint (staged TypeScript)
        entry: npx --no-install eslint --cache --cache-strategy content
        language: system
        files: \\.(ts|tsx)$
        pass_filenames: true
