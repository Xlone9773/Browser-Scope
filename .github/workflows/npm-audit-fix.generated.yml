name: Automated npm audit fix

on:
  schedule:
    # Run weekly on Monday at 03:00 UTC (11:00 AM CST)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no PR will be opened)'
        required: false
        type: boolean
        default: false

# Ensure the workflow has write permissions for contents and pull requests so the
# create-pull-request action (and any git push) can succeed.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-audit-fix
  cancel-in-progress: true

jobs:
  audit-fix:
    name: Run npm audit fix and open PR
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --legacy-peer-deps --no-fund --no-audit
          else
            npm install --legacy-peer-deps --no-fund --no-audit
          fi

      - name: Run auto-fix script
        id: auto_fix
        run: |
          ARGS="--pr-summary=audit-fix-summary.md"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run $ARGS"
          fi
          npx tsx scripts/auto-fix-audit.ts $ARGS

      - name: Check for manifest changes
        id: check_changes
        run: |
          if git status --porcelain -- package.json package-lock.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Modified dependency files:"
            git status --short -- package.json package-lock.json
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency files changed after audit fix."
          fi

      - name: Run typecheck
        id: typecheck_step
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          npx tsc --noEmit > tsc-output.log 2>&1

      - name: Run lint (oxlint & eslint)
        id: lint_step
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          npx oxlint
          npx eslint . --format=json --output-file=eslint-report.json

      - name: Run tests
        id: test_step
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          npx vitest run --reporter=default --reporter=json --outputFile=test-results.json

      - name: Run build verification
        id: build_step
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          npm run build > build-output.log 2>&1

      - name: Generate CI Summary (Audit Fix Phase)
        if: always()
        run: |
          npm audit --json > audit-report.json || true
          if [ "${{ steps.check_changes.outputs.changed }}" = "true" ] && [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            npx tsx scripts/ci-summary.ts --mode=lint --status=${{ steps.lint_step.outcome }} || true
            npx tsx scripts/ci-summary.ts --mode=test --status=${{ steps.test_step.outcome }} || true
            npx tsx scripts/ci-summary.ts --mode=build --status=${{ steps.build_step.outcome }} || true
          fi

      - name: Show git diff
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "Git status:"
          git status --porcelain
          echo "--- Diff ---"
          git --no-pager diff --stat -- package.json package-lock.json || true

      - name: Prepare PR summary and clean temporary artifacts
        id: pr_prep
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          {
            echo "summary<<AUDIT_EOF"
            if [ -f audit-fix-summary.md ]; then
              cat audit-fix-summary.md
            else
              echo "Automated non-major dependency security updates applied."
            fi
            echo "AUDIT_EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f package.json.bak tsc-output.log eslint-report.json test-results.json build-output.log audit-report.json audit-fix-summary.md

      - name: Create or update PR with dependency fixes
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: 'chore/automated-audit-fix'
          delete-branch: true
          commit-message: 'chore(deps): automated security audit fixes'
          title: '🛡️ chore(deps): automated security audit fixes'
          body: |
            ## 🛡️ Automated Security Audit Fixes

            This PR was created automatically by the **Automated npm audit fix** workflow.

            ${{ steps.pr_prep.outputs.summary }}

            ### ✅ Verification Gates
            - [x] `scripts/auto-fix-audit.ts` two-phase non-major triage applied
            - [x] TypeScript strict typecheck (`tsc --noEmit`) passed
            - [x] Linter checks (`oxlint` & `eslint`) passed
            - [x] Unit test suite (`vitest run`) passed
            - [x] Production build (`npm run build`) succeeded

            ---
            ### 🔍 How to Verify Locally
            ```bash
            git fetch origin
            git checkout chore/automated-audit-fix
            npm install
            npm run lint && npm test && npm run build
            ```
          labels: |
            automated
            dependencies
            security
