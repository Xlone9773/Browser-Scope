name: Automated npm audit fix

on:
  schedule:
    # Run weekly on Monday at 03:00 UTC (11:00 AM CST)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no PR will be opened)'
        required: false
        type: boolean
        default: false

# Ensure the workflow has write permissions for contents and pull requests so the
# create-pull-request action (and any git push) can succeed.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-audit-fix
  cancel-in-progress: true

jobs:
  audit-fix:
    name: Run npm audit fix and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persist the GITHUB_TOKEN credentials in the checked-out repo so
          # subsequent git push operations (used by create-pull-request) will
          # authenticate as the github-actions[bot].
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps --no-fund --no-audit

      - name: Run auto-fix script
        id: auto_fix
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          npx tsx scripts/auto-fix-audit.ts $ARGS

      - name: Check for changes
        id: check_changes
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Modified files:"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No files changed after audit fix."
          fi

      - name: Run typecheck
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: npx tsc --noEmit

      - name: Run tests
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: npx vitest run

      - name: Run build verification
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: npm run build

      - name: Show git diff
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "Git status:"
          git status --porcelain
          echo "--- Diff ---"
          git --no-pager diff --stat || true

      - name: Create or update PR with dependency fixes
        if: steps.check_changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: 'main'
          branch: 'chore/automated-audit-fix'
          delete-branch: true
          commit-message: 'chore(deps): automated security audit fixes'
          title: '🛡️ chore(deps): automated security audit fixes'
          body: |
            ## 🛡️ Automated Security Audit Fixes

            This PR was created automatically by the **Automated npm audit fix** workflow.
            All automated changes have passed strict verification checks:

            - [x] `scripts/auto-fix-audit.ts` triage applied (Safe Minor/Patch & Overrides)
            - [x] TypeScript strict typecheck (`tsc --noEmit`) passed
            - [x] Unit test suite (`vitest run`) passed
            - [x] Production build (`npm run build`) succeeded

            ---
            ### 🔍 How to Verify Locally
            ```bash
            git fetch origin
            git checkout chore/automated-audit-fix
            npm ci
            npm test && npm run build
            ```
          labels: |
            automated
            dependencies
            security
